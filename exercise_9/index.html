<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Jogador</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container">

        <h1>Cadastro de Jogador</h1>
        <p>Cadastre seu jogador de futebol.</p>

        <form id="formulario">

            <div class="campo">
                <label for="nome">Nome do jogador:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Ex: Vinícius Júnior"
                >
            </div>

            <div class="campo">
                <label for="idade">Idade:</label>
                <input
                    type="number"
                    id="idade"
                    placeholder="Ex: 25"
                >
            </div>

            <div class="campo">
                <label for="posicao">Posição:</label>

                <select id="posicao">
                    <option value="">Selecione uma posição</option>
                    <option value="goleiro">Goleiro</option>
                    <option value="zagueiro">Zagueiro</option>
                    <option value="lateral">Lateral</option>
                    <option value="meia">Meia</option>
                    <option value="atacante">Atacante</option>
                </select>
            </div>

            <div class="campo">
                <label for="time">Time:</label>
                <input
                    type="text"
                    id="time"
                    placeholder="Ex: Real Madrid"
                >
            </div>

            <div class="campo">
                <label for="numero">Número da camisa:</label>
                <input
                    type="number"
                    id="numero"
                    placeholder="Ex: 7"
                    min="1"
                    max="99"
                >
            </div>

            <div class="campo">
                <label for="gol">Gols na temporada:</label>
                <input
                    type="number"
                    id="gol"
                    placeholder="Ex: 15"
                    min="0"
                >
            </div>

            <div class="campo">
                <label for="observacao">Observação:</label>
                <textarea
                    id="observacao"
                    placeholder="Fale um pouco sobre o jogador..."
                ></textarea>
            </div>

            <div class="campo-checkbox">

                <input
                    type="checkbox"
                    id="titular"
                >

                <label for="titular">
                    Jogador foi titular na última partida?
                </label>

            </div>

            <button type="submit" id="btnCadastrar">
                Cadastrar jogador
            </button>

        </form>

        <section id="resultado">
        </section>

    </main>

    <script src="main.js"></script>

</body>
</html>
